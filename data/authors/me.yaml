bio: |
  I am an evolutionary biologist and molecular ecologist born and raised in Bogotá, Colombia. I am interested in understanding how evolutionary and ecological processes interact to shape the evolutionary trajectories of natural plant populations. 
  My research combines population genomics and quantitative genetics to investigate local adaptation, demographic history, and biological invasions.
  
  Currently, I am Postdoctoral Fellow in the Department of Ecology & Evolutionary Biology at the University of Toronto in the Wright Lab. As part of a large collaborative project, 
  I study the invasion history and genetic basis of adaptation in capeweed (*Arctotheca calendula*) across Australia. For this project I will be working on temporal population genomics of capeweed, 
  using herbarium records to reconstruct patterns of introduction, spread, and adaptation over time.

  I completed my PhD in Biology at Queen's University in 2026 under the supervision of Dr. Rob Colautti and my MSc in Integrated Biosciences from the University of Minnesota Duluth in 2021, 
  where I was co-supervised by Dr. Briana Gross and Dr. Julie Etterson. Previous to that, I obtained an BS in Cell and Molecular Biology and a BA in Communication from the University of 
  Minnesota Duluth in 2018. Learn more on my [Research](/#research) and [Publications](/publications) page.

  As a scientist and educator with multiple intersecting identities, I am deeply committed to teaching, mentorship, anti-oppressive approaches to science education, and science communication. These have been central to my academic training, 
  and I strive to incorporate them into every aspect of my work. Learn more on my [Teaching](/#teaching) page.
 
  
