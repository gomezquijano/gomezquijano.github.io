bio: |
  I am an evolutionary biologist and molecular ecologist interested in how evolutionary forces interact with ecological processes to shape the evolutionary trajectories of natural plant populations. 
  My research combines population genomics and quantitative genetic approaches to investigate local adaptation, demographic history, and biological invasions.
  
  I completed my PhD in Biology at Queen's University in 2026 supervised by Dr. Rob Colautti, and my MSc in Integrated Biosciences at the University of Minnesota Duluth in 2021 co-supervised by Dr. Briana Gross and Dr. Julie Etterson.
  
  I am currently a Postdoctoral Fellow in the Department of Ecology and Evolutionary Biology at the University of Toronto in the Wright Lab. 
  I am working on a large collaborative project investigating the invasion history and genetic basis of adaptation in capeweed (Arctotheca calendula) across Australia. 
  My current research focuses on temporal population genomics, using herbarium collections to reconstruct patterns of introduction, spread, and adaptation through time.
  
