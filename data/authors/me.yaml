bio: |
  I am an evolutionary biologist and molecular ecologist interested in how evolutionary and ecological processes interact to shape the evolutionary trajectories of natural plant populations. 
  My research combines population genomics and quantitative genetics to investigate local adaptation, demographic history, and biological invasions.
  
  currently I am Postdoctoral Fellow in the Department of Ecology & Evolutionary Biology at the University of Toronto in the Wright Lab. As part of a large collaborative project, 
  I study the invasion history and genetic basis of adaptation in capeweed (*Arctotheca calendula*) across Australia. For this project I will be working on temporal population genomics of capeweed, 
  using herbarium records to reconstruct patterns of introduction, spread, and adaptation over time.

  I completed my PhD in Biology at Queen's University in 2026 under the supervision of Dr. Rob Colautti. I previously earned an MSc in Integrated Biosciences from the University of Minnesota Duluth in 2021, 
  where I was co-supervised by Dr. Briana Gross and Dr. Julie Etterson. (Visit "Research" and "Publications" section to learn more!)

  Beyond research, I am deeply committed to teaching, mentorship, anti-oppressive approaches to science education, and science communication. These have been central to my academic training, 
  and I strive to incorporate them into every aspect of my work. (Visit "Teaching" section to learn more!)
 
  
