bio: |
  I am an evolutionary biologist and molecular ecologist interested in how evolutionary and ecological processes 
  interact to shape the evolutionary trajectories of natural plant populations. My research combines population genomics 
  and quantitative genetics to investigate local adaptation, demographic history, and biological invasions.
  
  Beyond research, I am deeply committed to teaching, mentorship, anti-oppressive approaches to science education, and science communication. 
  These have been central to my academic training, and I strive to incorporate them into every aspect of my work.
  
  Icompleted my PhD in Biology at Queen's University in 2026 under the supervision of Dr. Rob Colautti. 
  I previously earned an MSc in Integrated Biosciences from the University of Minnesota Duluth in 2021, 
  where I was co-supervised by Dr. Briana Gross and Dr. Julie Etterson.
  
  I am currently a Postdoctoral Fellow in the Department of Ecology & Evolutionary Biology at the University of Toronto in the Wright Lab. 
  As part of a large collaborative project, I study the invasion history and genetic basis of adaptation in capeweed (*Arctotheca calendula*) across Australia. 
  
